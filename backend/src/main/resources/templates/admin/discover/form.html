<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admin/fragments :: head('Tạo/Sửa Mục Khám phá')}"></head>
<body>
<div th:replace="~{admin/fragments :: navbar}"></div>

<div class="container-fluid">
    <div class="row">
        <nav th:replace="~{admin/fragments :: sidebar}"></nav>

        <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 main-content">
            <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-4 border-bottom">
                <h1 class="h2"><i class="bi bi-pencil-square text-primary me-2"></i>Soạn thảo Mục Khám phá</h1>
                <a th:href="@{/admin/discover}" class="btn btn-outline-secondary"><i class="bi bi-arrow-left me-1"></i>Quay lại</a>
            </div>

            <div class="row">
                <div class="col-lg-8">
                    <div class="card">
                        <div class="card-body">
                            <form th:action="@{/admin/discover}" th:object="${item}" method="post">
                                <input type="hidden" th:field="*{id}">
                                <div class="mb-3">
                                    <label class="form-label fw-bold">Tiêu đề (Tiếng Việt)</label>
                                    <input type="text" class="form-control" th:field="*{titleVi}" required placeholder="Ví dụ: Bí quyết ăn uống cân bằng tăng 200% hiệu quả tập">
                                </div>
                                <div class="row">
                                    <div class="col-md-6 mb-3">
                                        <label class="form-label fw-bold">Phân khu / Thể loại (Khớp với Mobile App)</label>
                                        <select class="form-select" th:field="*{category}">
                                            <option value="Giới thiệu App">Giới thiệu App (Banner Đầu Trang)</option>
                                            <option value="Góc Kiến Thức & Mẹo">Góc Kiến Thức & Mẹo Tập Luyện</option>
                                            <option value="Hệ Sinh Thái Dự Án">Hệ Sinh Thái Dự Án HomeFit</option>
                                        </select>
                                    </div>
                                    <div class="col-md-6 mb-3">
                                        <label class="form-label fw-bold">Thứ tự hiển thị</label>
                                        <input type="number" class="form-control" th:field="*{sortOrder}" value="1">
                                    </div>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label fw-bold">URL Ảnh bìa / Icon</label>
                                    <input type="url" class="form-control" th:field="*{coverUrl}" required placeholder="https://images.unsplash.com/...">
                                </div>
                                <div class="mb-3">
                                    <label class="form-label fw-bold">Mô tả / Nội dung hiển thị</label>
                                    <textarea class="form-control" th:field="*{description}" rows="3" placeholder="Tóm tắt nội dung hiển thị trên ứng dụng di động..."></textarea>
                                </div>
                                <button type="submit" class="btn btn-primary"><i class="bi bi-save me-1"></i>Lưu thông tin</button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
</div>

<div th:replace="~{admin/fragments :: scripts}"></div>
</body>
</html>
