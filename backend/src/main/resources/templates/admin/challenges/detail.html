<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admin/fragments :: head('Chi tiết Thử thách 28 ngày')}"></head>
<body>
<div th:replace="~{admin/fragments :: navbar}"></div>

<div class="container-fluid">
    <div class="row">
        <nav th:replace="~{admin/fragments :: sidebar}"></nav>

        <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 main-content">
            <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-4 border-bottom">
                <h1 class="h2">
                    <i class="bi bi-trophy-fill text-warning me-2"></i>
                    Chi tiết Thử thách 28 ngày - Cấp độ <span class="text-uppercase" th:text="${level}">easy</span>
                </h1>
                <a th:href="@{/admin/challenges}" class="btn btn-outline-secondary"><i class="bi bi-arrow-left me-1"></i>Quay lại</a>
            </div>

            <div class="alert alert-info d-flex align-items-center mb-4" role="alert">
                <i class="bi bi-info-circle-fill me-2 fs-5"></i>
                <div>
                    Lịch tập 28 ngày gồm 4 tuần (mỗi tuần 6 ngày tập + 1 ngày nghỉ). Bạn có thể xem và tuỳ chỉnh danh sách bài tập cho từng ngày.
                </div>
            </div>

            <div class="card mb-4" th:each="week : ${#numbers.sequence(1, 4)}">
                <div class="card-header bg-light fw-bold">
                    <i class="bi bi-calendar3 me-2"></i>Tuần <span th:text="${week}">1</span>
                </div>
                <div class="card-body">
                    <div class="row g-3">
                        <div class="col-6 col-md-3 col-lg-2" th:each="day : ${#numbers.sequence((week - 1) * 7 + 1, week * 7)}">
                            <div class="card h-100 text-center" th:classappend="${day % 7 == 0 ? 'bg-light border-secondary opacity-75' : 'border-primary'}">
                                <div class="card-body p-2">
                                    <h6 class="fw-bold mb-1" th:text="'Ngày ' + ${day}">Ngày 1</h6>
                                    <div th:if="${day % 7 == 0}">
                                        <span class="badge bg-secondary mb-2">NGÀY NGHỈ</span>
                                        <p class="small text-muted mb-0">Thả lỏng cơ bắp</p>
                                    </div>
                                    <div th:unless="${day % 7 == 0}">
                                        <span class="badge bg-primary mb-2" th:text="${day % 3 == 1 ? 'Ngực & Tay' : (day % 3 == 2 ? 'Lưng & Bụng' : 'Chân')}">Ngực & Tay</span>
                                        <p class="small text-muted mb-0">8-10 bài tập</p>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
</div>

<div th:replace="~{admin/fragments :: scripts}"></div>
</body>
</html>
