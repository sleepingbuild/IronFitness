<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title} + ' – HomeFit Admin'">HomeFit Admin</title>
    <!-- Bootstrap tải từ CDN: cần Internet. Nếu mất mạng trang vẫn dùng được nhưng không có kiểu dáng. -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>
<nav th:fragment="navbar(active)" class="navbar navbar-expand navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand" th:href="@{/admin}">HomeFit Admin</a>
        <ul class="navbar-nav me-auto">
            <li class="nav-item">
                <a class="nav-link" th:classappend="${active == 'dashboard'} ? 'active'" th:href="@{/admin}">Tổng quan</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" th:classappend="${active == 'categories'} ? 'active'" th:href="@{/admin/categories}">Nhóm cơ</a>
            </li>
            <li class="nav-item">
                <span class="nav-link disabled">Bài tập (sắp có)</span>
            </li>
        </ul>
        <span class="navbar-text me-3" th:text="${adminEmail}">admin@example.com</span>
        <form th:action="@{/admin/logout}" method="post" class="m-0">
            <button type="submit" class="btn btn-outline-light btn-sm">Đăng xuất</button>
        </form>
    </div>
</nav>
</body>
</html>
