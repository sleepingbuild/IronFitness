<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admin/fragments :: head('Danh sách Nhóm cơ')}"></head>
<body>
<div th:replace="~{admin/fragments :: navbar}"></div>

<div class="container-fluid">
    <div class="row">
        <nav th:replace="~{admin/fragments :: sidebar}"></nav>

        <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 main-content">
            <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-4 border-bottom">
                <h1 class="h2">Quản lý Nhóm cơ</h1>
                <div class="btn-toolbar mb-2 mb-md-0">
                    <a th:href="@{/admin/categories/create}" class="btn btn-sm btn-primary">
                        <i class="bi bi-plus-lg"></i> Thêm nhóm cơ
                    </a>
                </div>
            </div>

            <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
                <span th:text="${successMessage}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>

            <div class="card">
                <div class="card-body p-0">
                    <div class="table-responsive">
                        <table class="table table-striped table-hover align-middle mb-0">
                            <thead class="table-light">
                            <tr>
                                <th class="ps-4">ID</th>
                                <th>Tên nhóm cơ</th>
                                <th>Slug</th>
                                <th>Thứ tự</th>
                                <th>Trạng thái</th>
                                <th class="pe-4 text-end">Thao tác</th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr th:if="${categories == null or categories.isEmpty()}">
                                <td colspan="6" class="text-center py-4 text-muted">Chưa có dữ liệu</td>
                            </tr>
                            <tr th:each="cat : ${categories}">
                                <td class="ps-4" th:text="${cat.id}">1</td>
                                <td class="fw-bold" th:text="${cat.name}">Bụng</td>
                                <td th:text="${cat.slug}">abs</td>
                                <td th:text="${cat.sortOrder}">1</td>
                                <td>
                                            <span class="badge" th:classappend="${cat.isActive} ? 'bg-success' : 'bg-secondary'"
                                                  th:text="${cat.isActive} ? 'Hoạt động' : 'Đã ẩn'">Hoạt động</span>
                                </td>
                                <td class="pe-4 text-end">
                                    <a th:href="@{/admin/categories/{id}/edit(id=${cat.id})}" class="btn btn-sm btn-outline-primary">
                                        <i class="bi bi-pencil"></i> Sửa
                                    </a>
                                </td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>
</div>
<div th:replace="~{admin/fragments :: scripts}"></div>
</body>
</html>
