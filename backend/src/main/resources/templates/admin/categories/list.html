<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admin/fragments :: head('Nhóm cơ')}"></head>
<body>
<nav th:replace="~{admin/fragments :: navbar('categories')}"></nav>
<main class="container">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="h4 m-0">Nhóm cơ</h1>
        <a class="btn btn-dark" th:href="@{/admin/categories/new}">Thêm nhóm cơ</a>
    </div>
    <div class="alert alert-success" th:if="${message}" th:text="${message}">Đã lưu.</div>
    <div class="table-responsive">
        <table class="table table-hover align-middle">
            <thead>
            <tr>
                <th>ID</th>
                <th>Tên</th>
                <th>Slug</th>
                <th>Thứ tự</th>
                <th>Trạng thái</th>
                <th>Cập nhật</th>
                <th></th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="c : ${rows}">
                <td th:text="${c.id()}">1</td>
                <td th:text="${c.name()}">Bụng</td>
                <td th:text="${c.slug()}">abs</td>
                <td th:text="${c.sortOrder()}">1</td>
                <td>
                    <span class="badge bg-success" th:if="${c.active()}">Đang hiện</span>
                    <span class="badge bg-secondary" th:unless="${c.active()}">Đã ẩn</span>
                </td>
                <td th:text="${c.updatedAtText()}">01/01/2026 08:00</td>
                <td class="text-end text-nowrap">
                    <a class="btn btn-sm btn-outline-dark" th:href="@{/admin/categories/{id}/edit(id=${c.id()})}">Sửa</a>
                    <form class="d-inline" method="post" th:action="@{/admin/categories/{id}/toggle(id=${c.id()})}">
                        <button type="submit" class="btn btn-sm btn-outline-secondary"
                                th:text="${c.active()} ? 'Ẩn' : 'Hiện lại'">Ẩn</button>
                    </form>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(rows)}">
                <td colspan="7" class="text-center text-muted">Chưa có nhóm cơ nào.</td>
            </tr>
            </tbody>
        </table>
    </div>
</main>
</body>
</html>
