<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admin/fragments :: head(${title})}"></head>
<body>
<div th:replace="~{admin/fragments :: navbar}"></div>

<div class="container-fluid">
    <div class="row">
        <nav th:replace="~{admin/fragments :: sidebar}"></nav>

        <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 main-content">
            <div class="pt-3 pb-2 mb-4 border-bottom">
                <h1 class="h2" th:text="${title}">Soạn thảo nhóm cơ</h1>
            </div>

            <div class="card" style="max-width: 600px;">
                <div class="card-body">
                    <form th:action="@{${formAction}}" th:object="${form}" method="post">

                        <div th:if="${#fields.hasAnyErrors()}" class="alert alert-danger">
                            Vui lòng kiểm tra lại các thông tin bên dưới.
                        </div>

                        <div class="mb-3">
                            <label for="name" class="form-label fw-bold">Tên nhóm cơ <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="name" th:field="*{name}" required>
                            <div class="text-danger small mt-1" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
                        </div>

                        <div class="mb-3">
                            <label for="slug" class="form-label fw-bold">Slug (Mã định danh) <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="slug" th:field="*{slug}" placeholder="VD: chest, abs..." required>
                            <div class="text-danger small mt-1" th:if="${#fields.hasErrors('slug')}" th:errors="*{slug}"></div>
                        </div>

                        <div class="mb-3">
                            <label for="iconUrl" class="form-label fw-bold">URL Icon (Tùy chọn)</label>
                            <input type="url" class="form-control" id="iconUrl" th:field="*{iconUrl}">
                        </div>

                        <div class="mb-3">
                            <label for="sortOrder" class="form-label fw-bold">Thứ tự hiển thị <span class="text-danger">*</span></label>
                            <input type="number" class="form-control" id="sortOrder" th:field="*{sortOrder}" min="0" required>
                        </div>

                        <div class="mb-4 form-check form-switch">
                            <input class="form-check-input" type="checkbox" id="active" th:field="*{active}">
                            <label class="form-check-label fw-bold" for="active">Hoạt động (Hiển thị trên App)</label>
                        </div>

                        <div class="d-flex justify-content-end gap-2">
                            <a th:href="@{/admin/categories}" class="btn btn-light border">Hủy</a>
                            <button type="submit" class="btn btn-primary"><i class="bi bi-save"></i> Lưu lại</button>
                        </div>
                    </form>
                </div>
            </div>
        </main>
    </div>
</div>
<div th:replace="~{admin/fragments :: scripts}"></div>
</body>
</html>
