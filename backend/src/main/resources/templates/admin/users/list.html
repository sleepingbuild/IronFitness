<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admin/fragments :: head('Quản lý Người dùng')}"></head>
<body>
<div th:replace="~{admin/fragments :: navbar}"></div>

<div class="container-fluid">
    <div class="row">
        <nav th:replace="~{admin/fragments :: sidebar}"></nav>

        <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 main-content">
            <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-4 border-bottom">
                <h1 class="h2">Quản lý Người dùng</h1>
            </div>

            <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
                <span th:text="${successMessage}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>

            <div class="card">
                <div class="card-body p-0">
                    <div class="table-responsive">
                        <table class="table table-striped table-hover align-middle mb-0">
                            <thead class="table-light">
                            <tr>
                                <th class="ps-4">ID</th>
                                <th>Email</th>
                                <th>Tên hiển thị</th>
                                <th>Loại tài khoản</th>
                                <th>Ngày tham gia</th>
                                <th class="pe-4 text-end">Thao tác Premium</th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr th:if="${users == null or users.isEmpty()}">
                                <td colspan="6" class="text-center py-4 text-muted">Chưa có dữ liệu</td>
                            </tr>
                            <tr th:each="user : ${users}">
                                <td class="ps-4" th:text="${user.id}">1</td>
                                <td class="fw-bold" th:text="${user.email}">user@example.com</td>
                                <td th:text="${user.displayName ?: '(Chưa cập nhật)'}">Tên</td>
                                <td>
                                            <span class="badge" th:classappend="${user.isPremium} ? 'bg-warning text-dark' : 'bg-secondary'"
                                                  th:text="${user.isPremium} ? 'Premium' : 'Tiêu chuẩn'"></span>
                                </td>
                                <td th:text="${#temporals.format(user.createdAt, 'dd/MM/yyyy')}">01/01/2026</td>
                                <td class="pe-4 text-end">
                                    <!-- Form POST để toggle Premium -->
                                    <form th:action="@{/admin/users/{id}/toggle-premium(id=${user.id})}" method="post" class="m-0">
                                        <button type="submit" class="btn btn-sm" th:classappend="${user.isPremium} ? 'btn-outline-danger' : 'btn-outline-warning'">
                                            <i class="bi" th:classappend="${user.isPremium} ? 'bi-star' : 'bi-star-fill'"></i>
                                            <span th:text="${user.isPremium} ? 'Gỡ Premium' : 'Cấp Premium'"></span>
                                        </button>
                                    </form>
                                </td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>
</div>
<div th:replace="~{admin/fragments :: scripts}"></div>
</body>
</html>
