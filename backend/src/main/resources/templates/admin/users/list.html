<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admin/fragments :: head('Quản lý Người dùng')}"></head>
<body>
<div th:replace="~{admin/fragments :: navbar}"></div>

<div class="container-fluid">
    <div class="row">
        <nav th:replace="~{admin/fragments :: sidebar}"></nav>

        <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 main-content">
            <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-4 border-bottom">
                <h1 class="h2"><i class="bi bi-people-fill text-primary me-2"></i>Quản lý Người dùng & Hồ sơ</h1>
            </div>

            <div th:if="${message}" class="alert alert-success alert-dismissible fade show" role="alert">
                <span th:text="${message}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>

            <div class="card">
                <div class="card-body p-0">
                    <div class="table-responsive">
                        <table class="table table-striped table-hover align-middle mb-0">
                            <thead class="table-light">
                            <tr>
                                <th class="ps-4">ID</th>
                                <th>Email</th>
                                <th>Tên hiển thị</th>
                                <th>Loại tài khoản</th>
                                <th>Ngày tham gia</th>
                                <th class="pe-4 text-end">Thao tác</th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr th:if="${users == null or users.isEmpty()}">
                                <td colspan="6" class="text-center py-4 text-muted">Chưa có dữ liệu người dùng</td>
                            </tr>
                            <tr th:each="user : ${users}">
                                <td class="ps-4" th:text="${user.id}">1</td>
                                <td class="fw-bold" th:text="${user.email}">user@example.com</td>
                                <td th:text="${user.displayName != null and !user.displayName.isEmpty() ? user.displayName : '(Chưa cập nhật)'}">Tên</td>
                                <td>
                                    <span class="badge" th:classappend="${user.premium} ? 'bg-warning text-dark' : 'bg-secondary'"
                                          th:text="${user.premium} ? 'Premium ⚡' : 'Tiêu chuẩn'"></span>
                                </td>
                                <td th:text="${user.createdAtText != null and !user.createdAtText.isEmpty() ? user.createdAtText : 'Mới tham gia'}">01/01/2026</td>
                                <td class="pe-4 text-end">
                                    <div class="d-inline-flex gap-1 align-items-center">
                                        <a th:href="@{/admin/users/{id}(id=${user.id})}" class="btn btn-sm btn-outline-info">
                                            <i class="bi bi-eye"></i> Hồ sơ
                                        </a>
                                        <form th:action="@{/admin/users/{id}/toggle-premium(id=${user.id})}" method="post" class="m-0">
                                            <button type="submit" class="btn btn-sm" th:classappend="${user.premium} ? 'btn-outline-danger' : 'btn-outline-warning'">
                                                <i class="bi" th:classappend="${user.premium} ? 'bi-star' : 'bi-star-fill'"></i>
                                                <span th:text="${user.premium} ? 'Gỡ PRO' : 'Cấp PRO'"></span>
                                            </button>
                                        </form>
                                    </div>
                                </td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>
</div>
<div th:replace="~{admin/fragments :: scripts}"></div>
</body>
</html>
