<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admin/fragments :: head('Tạo/Sửa Buổi tập')}"></head>
<body>
<div th:replace="~{admin/fragments :: navbar}"></div>

<style>
    @media (min-width: 1024px) {
        .workout-form-row {
            display: flex;
            flex-wrap: wrap;
        }
        .workout-left-col {
            flex: 0 0 38%;
            max-width: 38%;
        }
        .workout-right-col {
            flex: 0 0 62%;
            max-width: 62%;
        }
    }
</style>

<div class="container-fluid">
    <div class="row">
        <nav th:replace="~{admin/fragments :: sidebar}"></nav>

        <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 main-content">
            <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-4 border-bottom">
                <h1 class="h2"><i class="bi bi-pencil-square text-primary me-2"></i>Soạn thảo Buổi tập</h1>
                <a th:href="@{/admin/workouts}" class="btn btn-outline-secondary"><i class="bi bi-arrow-left me-1"></i>Quay lại</a>
            </div>

            <form th:action="@{/admin/workouts}" th:object="${workout}" method="post" id="workoutForm">
                <input type="hidden" th:field="*{id}">

                <div class="row workout-form-row">
                    <!-- Cột thông tin chung (38% trên Desktop) -->
                    <div class="col-12 col-lg-5 workout-left-col mb-4">
                        <div class="card shadow-sm h-100">
                            <div class="card-header bg-white fw-bold py-3"><i class="bi bi-info-circle text-primary me-2"></i>Thông tin Buổi tập</div>
                            <div class="card-body">
                                <div class="mb-3">
                                    <label class="form-label fw-bold">Tên buổi tập (Tiếng Việt) <span class="text-danger">*</span></label>
                                    <input type="text" class="form-control" th:field="*{titleVi}" required placeholder="Ví dụ: Đốt cháy mỡ toàn thân">
                                </div>

                                <div class="mb-3">
                                    <label class="form-label fw-bold">Ảnh bìa (Cover Image URL)</label>
                                    <div class="input-group">
                                        <input type="text" class="form-control" id="coverImageUrl" th:field="*{coverImageUrl}" placeholder="https://... hoặc /uploads/workouts/..." onchange="updateCoverPreview()">
                                        <input type="file" id="coverFileInput" accept="image/*" style="display:none;" onchange="uploadCoverFile(this)">
                                        <button class="btn btn-outline-primary" type="button" onclick="document.getElementById('coverFileInput').click()"><i class="bi bi-upload me-1"></i>Tải ảnh</button>
                                        <button class="btn btn-outline-secondary" type="button" onclick="previewCover()"><i class="bi bi-eye me-1"></i>Xem</button>
                                    </div>
                                    <div id="uploadStatus" class="small mt-1"></div>

                                    <div class="mt-2" id="coverPreviewContainer" style="display: none;">
                                        <label class="form-label small text-muted">Khung xem trước ảnh bìa:</label>
                                        <div>
                                            <img id="coverPreviewImg" src="" alt="Cover Preview" class="rounded border shadow-sm" style="max-height: 160px; width: 100%; object-fit: cover;">
                                        </div>
                                    </div>
                                </div>

                                <div class="row">
                                    <div class="col-md-6 mb-3">
                                        <label class="form-label fw-bold">Phân loại buổi (Type)</label>
                                        <select class="form-select" th:field="*{type}">
                                            <option value="body_part">Body Part (Theo nhóm cơ)</option>
                                            <option value="timed">Timed (Thời lượng)</option>
                                            <option value="goal">Goal (Theo mục tiêu)</option>
                                            <option value="tabata">Tabata (6 phút)</option>
                                            <option value="stretch">Stretch (Kéo giãn)</option>
                                            <option value="signature">Signature (Đặc biệt)</option>
                                        </select>
                                    </div>
                                    <div class="col-md-6 mb-3">
                                        <label class="form-label fw-bold">Nhóm cơ chính</label>
                                        <select class="form-select" th:field="*{primaryMuscle}">
                                            <option value="Bụng">Bụng</option>
                                            <option value="Tay">Tay</option>
                                            <option value="Ngực">Ngực</option>
                                            <option value="Lưng">Lưng</option>
                                            <option value="Chân">Chân</option>
                                            <option value="Toàn thân">Toàn thân</option>
                                        </select>
                                    </div>
                                </div>

                                <div class="row">
                                    <div class="col-md-6 mb-3">
                                        <label class="form-label fw-bold">Độ khó</label>
                                        <select class="form-select" th:field="*{level}">
                                            <option value="easy">Dễ (Easy)</option>
                                            <option value="medium">Trung bình (Medium)</option>
                                            <option value="hard">Khó (Hard)</option>
                                        </select>
                                    </div>
                                    <div class="col-md-6 mb-3">
                                        <label class="form-label fw-bold">Thẻ Mục tiêu (Goal tag)</label>
                                        <select class="form-select" th:field="*{goal}">
                                            <option value="abs">Cơ bụng (Abs)</option>
                                            <option value="chest">Ngực & Tay (Chest)</option>
                                            <option value="legs">Chân & Mông (Legs)</option>
                                            <option value="full_body">Toàn thân (Full Body)</option>
                                            <option value="fatloss">Đốt cháy mỡ (Fat Loss)</option>
                                            <option value="muscle">Xây dựng cơ bắp (Muscle)</option>
                                            <option value="keepfit">Giữ dáng (Keep Fit)</option>
                                            <option value="tabata">Tabata</option>
                                            <option value="stretch">Kéo giãn (Stretch)</option>
                                        </select>
                                    </div>
                                </div>

                                <div class="row">
                                    <div class="col-md-6 mb-3">
                                        <label class="form-label fw-bold">Thời gian làm bài mặc định (s)</label>
                                        <input type="number" class="form-control" th:field="*{workSec}" min="5" required>
                                    </div>
                                    <div class="col-md-6 mb-3">
                                        <label class="form-label fw-bold">Thời gian nghỉ mặc định (s)</label>
                                        <input type="number" class="form-control" th:field="*{restSec}" min="0" required>
                                    </div>
                                </div>

                                <div class="mb-3">
                                    <label class="form-label fw-bold">Trạng thái phát hành</label>
                                    <select class="form-select" th:field="*{status}">
                                        <option value="PUBLISHED">Phát hành (PUBLISHED)</option>
                                        <option value="DRAFT">Bản nháp (DRAFT)</option>
                                    </select>
                                </div>

                                <div class="d-grid mt-4">
                                    <button type="submit" class="btn btn-primary btn-lg fw-bold"><i class="bi bi-save me-1"></i>Lưu buổi tập & Danh sách bài</button>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Cột danh sách bài tập con (62% trên Desktop) -->
                    <div class="col-12 col-lg-7 workout-right-col mb-4">
                        <div class="card shadow-sm h-100">
                            <div class="card-header bg-white py-3 d-flex justify-content-between align-items-center">
                                <span class="fw-bold"><i class="bi bi-list-check text-success me-2"></i>Danh sách Bài tập trong Buổi tập này (<span id="itemCountDisplay" th:text="${workoutItems != null ? workoutItems.size() : (workout.items != null ? workout.items.size() : 0)}">0</span> bài)</span>
                                <button type="button" class="btn btn-success btn-sm fw-bold" data-bs-toggle="modal" data-bs-target="#addExerciseModal">
                                    <i class="bi bi-plus-lg me-1"></i>+ Thêm bài tập
                                </button>
                            </div>
                            <div class="card-body p-0 table-responsive" style="max-height: 650px; overflow-y: auto; overflow-x: hidden;">
                                <table class="table table-hover align-middle mb-0" id="workoutItemsTable" style="table-layout: fixed; width: 100%;">
                                    <thead class="table-light sticky-top">
                                    <tr>
                                        <th style="width: 40px;" class="text-center">STT</th>
                                        <th style="width: 60px;" class="text-center">Ảnh</th>
                                        <th>Tên bài tập</th>
                                        <th style="width: 95px;">Đơn vị</th>
                                        <th style="width: 75px;" class="text-center">Số lượng</th>
                                        <th style="width: 70px;" class="text-center">Nghỉ (s)</th>
                                        <th style="width: 105px;" class="text-center">Thao tác</th>
                                    </tr>
                                    </thead>
                                    <tbody id="workoutItemsBody">
                                    <tr th:each="item, stat : ${workoutItems != null ? workoutItems : workout.items}" th:data-ex-id="${item.exerciseId}">
                                        <td class="row-stt fw-bold text-center" style="width: 40px; vertical-align: middle;" th:text="${stat.index + 1}">1</td>
                                        <td class="text-center" style="width: 60px; vertical-align: middle;">
                                            <input type="hidden" th:name="'items[' + ${stat.index} + '].exerciseId'" th:value="${item.exerciseId}" class="input-ex-id">
                                            <input type="hidden" th:name="'items[' + ${stat.index} + '].position'" th:value="${item.position}" class="input-pos">
                                            <input type="hidden" th:name="'items[' + ${stat.index} + '].block'" th:value="${item.block != null ? item.block : 'B'}" class="input-block">

                                            <img th:if="${exerciseMap != null and exerciseMap.get(item.exerciseId) != null}"
                                                 th:src="${exerciseMap.get(item.exerciseId).mediaUrl != null ? exerciseMap.get(item.exerciseId).mediaUrl : '/images/exercises/crunch.png'}"
                                                 alt="Thumb" style="width: 48px; height: 48px; min-width: 48px; object-fit: contain; background: #ffffff; border: 1px solid #e2e8f0; border-radius: 8px; padding: 2px;">
                                            <img th:unless="${exerciseMap != null and exerciseMap.get(item.exerciseId) != null}"
                                                 src="/images/exercises/crunch.png" alt="Thumb" style="width: 48px; height: 48px; min-width: 48px; object-fit: contain; background: #ffffff; border: 1px solid #e2e8f0; border-radius: 8px; padding: 2px;">
                                        </td>
                                        <td class="fw-bold small" style="vertical-align: middle; word-wrap: break-word;" th:text="${exerciseMap != null and exerciseMap.get(item.exerciseId) != null ? exerciseMap.get(item.exerciseId).name : 'Bài tập #' + item.exerciseId}">Tên bài</td>
                                        <td style="width: 95px; vertical-align: middle;">
                                            <select class="form-select form-select-sm input-measure" th:name="'items[' + ${stat.index} + '].measure'" style="padding: 0.25rem 0.3rem;">
                                                <option value="reps" th:selected="${item.measure == 'reps'}">lần</option>
                                                <option value="time" th:selected="${item.measure == 'time'}">giây</option>
                                            </select>
                                        </td>
                                        <td style="width: 75px; vertical-align: middle;" class="text-center">
                                            <input type="number" class="form-control form-control-sm input-value text-center px-1" th:name="'items[' + ${stat.index} + '].value'" th:value="${item.value}" min="1" required>
                                        </td>
                                        <td style="width: 70px; vertical-align: middle;" class="text-center">
                                            <input type="number" class="form-control form-control-sm input-rest text-center px-1" th:name="'items[' + ${stat.index} + '].restAfterSec'" th:value="${item.restAfterSec}" min="0" required>
                                        </td>
                                        <td class="text-center" style="width: 105px; vertical-align: middle; white-space: nowrap;">
                                            <div class="btn-group btn-group-sm">
                                                <button type="button" class="btn btn-outline-secondary btn-move-up" title="Lên"><i class="bi bi-arrow-up"></i></button>
                                                <button type="button" class="btn btn-outline-secondary btn-move-down" title="Xuống"><i class="bi bi-arrow-down"></i></button>
                                                <button type="button" class="btn btn-outline-danger btn-delete-item" title="Xóa"><i class="bi bi-trash"></i></button>
                                            </div>
                                        </td>
                                    </tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>
            </form>
        </main>
    </div>
</div>

<!-- Modal chọn bài tập từ thư viện 95 bài -->
<div class="modal fade" id="addExerciseModal" tabindex="-1" aria-labelledby="addExerciseModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-scrollable">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title fw-bold" id="addExerciseModalLabel"><i class="bi bi-search me-2 text-primary"></i>Thư viện Bài tập (95 Bài)</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <div class="row g-2 mb-3">
                    <div class="col-md-7">
                        <input type="text" id="modalSearchInput" class="form-control" placeholder="Tìm tên bài tập..." onkeyup="filterModalExercises()">
                    </div>
                    <div class="col-md-5">
                        <select id="modalCategoryFilter" class="form-select" onchange="filterModalExercises()">
                            <option value="">-- Tất cả nhóm cơ --</option>
                            <option value="abs">Bụng</option>
                            <option value="chest">Ngực</option>
                            <option value="arms">Tay</option>
                            <option value="legs">Chân</option>
                            <option value="back">Lưng</option>
                            <option value="full_body">Toàn thân</option>
                        </select>
                    </div>
                </div>

                <div class="list-group" id="modalExerciseList">
                    <label th:each="ex : ${exercises}" class="list-group-item list-group-item-action d-flex align-items-center modal-ex-item"
                           th:data-ex-id="${ex.id}"
                           th:data-ex-name="${ex.name}"
                           th:data-ex-media="${ex.mediaUrl != null ? ex.mediaUrl : '/images/exercises/crunch.png'}"
                           th:data-ex-reps="${ex.reps != null ? ex.reps : (ex.durationSec != null ? ex.durationSec : 12)}"
                           th:data-ex-measure="${ex.durationSec != null ? 'time' : 'reps'}"
                           th:data-ex-rest="${ex.restSec != null ? ex.restSec : 15}">
                        <input class="form-check-input me-3 modal-ex-checkbox" type="checkbox" th:value="${ex.id}">
                        <img th:src="${ex.mediaUrl != null ? ex.mediaUrl : '/images/exercises/crunch.png'}" alt="Thumb" style="width: 48px; height: 48px; min-width: 48px; object-fit: contain; background: #ffffff; border: 1px solid #e2e8f0; border-radius: 8px; padding: 2px;" class="me-3">
                        <div class="flex-grow-1">
                            <h6 class="mb-0 fw-bold" th:text="${ex.name}">Tên bài</h6>
                            <small class="text-muted" th:text="${ex.description != null ? ex.description : 'Bài tập thể hình'}">Mô tả bài tập</small>
                        </div>
                    </label>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Hủy</button>
                <button type="button" class="btn btn-success fw-bold" onclick="addSelectedExercisesFromModal()"><i class="bi bi-plus-circle me-1"></i>Thêm vào buổi tập</button>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{admin/fragments :: scripts}"></div>
<script>
    function updateCoverPreview() {
        const url = document.getElementById('coverImageUrl').value.trim();
        const container = document.getElementById('coverPreviewContainer');
        const img = document.getElementById('coverPreviewImg');
        if (url) {
            img.src = url;
            container.style.display = 'block';
        } else {
            container.style.display = 'none';
        }
    }

    function uploadCoverFile(input) {
        if (!input.files || input.files.length === 0) return;
        const file = input.files[0];
        const statusDiv = document.getElementById('uploadStatus');
        statusDiv.className = "small text-info mt-1";
        statusDiv.innerText = "Đang tải ảnh lên server...";

        const formData = new FormData();
        formData.append("file", file);

        fetch('/admin/workouts/upload-cover', {
            method: 'POST',
            body: formData
        })
        .then(response => response.json())
        .then(data => {
            if (data.status === "OK" && data.url) {
                document.getElementById('coverImageUrl').value = data.url;
                statusDiv.className = "small text-success mt-1";
                statusDiv.innerText = "Đã tải ảnh thành công: " + data.url;
                updateCoverPreview();
            } else {
                statusDiv.className = "small text-danger mt-1";
                statusDiv.innerText = "Lỗi tải ảnh: " + (data.message || "Không xác định");
            }
        })
        .catch(err => {
            statusDiv.className = "small text-danger mt-1";
            statusDiv.innerText = "Lỗi kết nối: " + err.message;
        });
    }

    function previewCover() {
        const url = document.getElementById('coverImageUrl').value;
        if (url) {
            window.open(url, 'Preview', 'width=800,height=500,scrollbars=yes');
        } else {
            alert("Vui lòng nhập hoặc tải Ảnh bìa trước khi xem.");
        }
    }

    function reindexTable() {
        const rows = document.querySelectorAll('#workoutItemsBody tr');
        document.getElementById('itemCountDisplay').innerText = rows.length;

        rows.forEach((row, index) => {
            row.querySelector('.row-stt').innerText = index + 1;
            const exIdInput = row.querySelector('.input-ex-id');
            const posInput = row.querySelector('.input-pos');
            const blockInput = row.querySelector('.input-block');
            const measureSelect = row.querySelector('.input-measure');
            const valInput = row.querySelector('.input-value');
            const restInput = row.querySelector('.input-rest');

            if (exIdInput) exIdInput.name = `items[${index}].exerciseId`;
            if (posInput) {
                posInput.name = `items[${index}].position`;
                posInput.value = index + 1;
            }
            if (blockInput) blockInput.name = `items[${index}].block`;
            if (measureSelect) measureSelect.name = `items[${index}].measure`;
            if (valInput) valInput.name = `items[${index}].value`;
            if (restInput) restInput.name = `items[${index}].restAfterSec`;
        });
    }

    function attachRowEvents(row) {
        const upBtn = row.querySelector('.btn-move-up');
        const downBtn = row.querySelector('.btn-move-down');
        const delBtn = row.querySelector('.btn-delete-item');

        if (upBtn) {
            upBtn.onclick = function() {
                if (row.previousElementSibling) {
                    row.parentNode.insertBefore(row, row.previousElementSibling);
                    reindexTable();
                }
            };
        }
        if (downBtn) {
            downBtn.onclick = function() {
                if (row.nextElementSibling) {
                    row.parentNode.insertBefore(row.nextElementSibling, row);
                    reindexTable();
                }
            };
        }
        if (delBtn) {
            delBtn.onclick = function() {
                row.remove();
                reindexTable();
            };
        }
    }

    function filterModalExercises() {
        const search = document.getElementById('modalSearchInput').value.toLowerCase().trim();
        const cat = document.getElementById('modalCategoryFilter').value.toLowerCase();
        const items = document.querySelectorAll('.modal-ex-item');

        items.forEach(item => {
            const name = item.getAttribute('data-ex-name').toLowerCase();
            const matchesSearch = name.includes(search);
            item.style.display = matchesSearch ? '' : 'none';
        });
    }

    function addSelectedExercisesFromModal() {
        const checkboxes = document.querySelectorAll('.modal-ex-checkbox:checked');
        const tbody = document.getElementById('workoutItemsBody');

        checkboxes.forEach(cb => {
            const label = cb.closest('.modal-ex-item');
            const exId = label.getAttribute('data-ex-id');
            const exName = label.getAttribute('data-ex-name');
            const exMedia = label.getAttribute('data-ex-media');
            const exVal = label.getAttribute('data-ex-reps') || 12;
            const exMeasure = label.getAttribute('data-ex-measure') || 'reps';
            const exRest = label.getAttribute('data-ex-rest') || 15;

            const tr = document.createElement('tr');
            tr.setAttribute('data-ex-id', exId);
            tr.innerHTML = `
                <td class="row-stt fw-bold text-center" style="width: 40px; vertical-align: middle;">0</td>
                <td class="text-center" style="width: 60px; vertical-align: middle;">
                    <input type="hidden" name="items[0].exerciseId" value="${exId}" class="input-ex-id">
                    <input type="hidden" name="items[0].position" value="1" class="input-pos">
                    <input type="hidden" name="items[0].block" value="B" class="input-block">
                    <img src="${exMedia}" alt="Thumb" style="width: 48px; height: 48px; min-width: 48px; object-fit: contain; background: #ffffff; border: 1px solid #e2e8f0; border-radius: 8px; padding: 2px;">
                </td>
                <td class="fw-bold small" style="vertical-align: middle; word-wrap: break-word;">${exName}</td>
                <td style="width: 95px; vertical-align: middle;">
                    <select class="form-select form-select-sm input-measure" name="items[0].measure" style="padding: 0.25rem 0.3rem;">
                        <option value="reps" ${exMeasure === 'reps' ? 'selected' : ''}>lần</option>
                        <option value="time" ${exMeasure === 'time' ? 'selected' : ''}>giây</option>
                    </select>
                </td>
                <td style="width: 75px; vertical-align: middle;" class="text-center">
                    <input type="number" class="form-control form-control-sm input-value text-center px-1" name="items[0].value" value="${exVal}" min="1" required>
                </td>
                <td style="width: 70px; vertical-align: middle;" class="text-center">
                    <input type="number" class="form-control form-control-sm input-rest text-center px-1" name="items[0].restAfterSec" value="${exRest}" min="0" required>
                </td>
                <td class="text-center" style="width: 105px; vertical-align: middle; white-space: nowrap;">
                    <div class="btn-group btn-group-sm">
                        <button type="button" class="btn btn-outline-secondary btn-move-up" title="Lên"><i class="bi bi-arrow-up"></i></button>
                        <button type="button" class="btn btn-outline-secondary btn-move-down" title="Xuống"><i class="bi bi-arrow-down"></i></button>
                        <button type="button" class="btn btn-outline-danger btn-delete-item" title="Xóa"><i class="bi bi-trash"></i></button>
                    </div>
                </td>
            `;
            tbody.appendChild(tr);
            attachRowEvents(tr);

            cb.checked = false;
        });

        reindexTable();
        const modal = bootstrap.Modal.getInstance(document.getElementById('addExerciseModal'));
        if (modal) modal.hide();
    }

    document.addEventListener("DOMContentLoaded", function() {
        updateCoverPreview();
        const rows = document.querySelectorAll('#workoutItemsBody tr');
        rows.forEach(r => attachRowEvents(r));
        reindexTable();
    });
</script>
</body>
</html>
