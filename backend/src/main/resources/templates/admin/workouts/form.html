<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admin/fragments :: head('Tạo/Sửa Buổi tập')}"></head>
<body>
<div th:replace="~{admin/fragments :: navbar}"></div>

<div class="container-fluid">
    <div class="row">
        <nav th:replace="~{admin/fragments :: sidebar}"></nav>

        <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 main-content">
            <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-4 border-bottom">
                <h1 class="h2"><i class="bi bi-pencil-square text-primary me-2"></i>Soạn thảo Buổi tập</h1>
                <a th:href="@{/admin/workouts}" class="btn btn-outline-secondary"><i class="bi bi-arrow-left me-1"></i>Quay lại</a>
            </div>

            <div class="row">
                <div class="col-lg-8">
                    <div class="card">
                        <div class="card-body">
                            <form th:action="@{/admin/workouts}" th:object="${workout}" method="post">
                                <input type="hidden" th:field="*{id}">

                                <div class="mb-3">
                                    <label class="form-label fw-bold">Tên buổi tập (Tiếng Việt) <span class="text-danger">*</span></label>
                                    <input type="text" class="form-control" th:field="*{titleVi}" required placeholder="Ví dụ: Đốt cháy mỡ toàn thân">
                                </div>

                                <div class="mb-3">
                                    <label class="form-label fw-bold">Ảnh bìa (Cover Image URL)</label>
                                    <div class="input-group">
                                        <input type="text" class="form-control" id="coverImageUrl" th:field="*{coverImageUrl}" placeholder="https://... hoặc /uploads/workouts/..." onchange="updateCoverPreview()">
                                        <input type="file" id="coverFileInput" accept="image/*" style="display:none;" onchange="uploadCoverFile(this)">
                                        <button class="btn btn-outline-primary" type="button" onclick="document.getElementById('coverFileInput').click()"><i class="bi bi-upload me-1"></i>Tải ảnh lên</button>
                                        <button class="btn btn-outline-secondary" type="button" onclick="previewCover()"><i class="bi bi-eye me-1"></i>Xem trước</button>
                                    </div>
                                    <div id="uploadStatus" class="small mt-1"></div>

                                    <!-- Khung xem trước ảnh bìa -->
                                    <div class="mt-2" id="coverPreviewContainer" style="display: none;">
                                        <label class="form-label small text-muted">Khung xem trước ảnh bìa:</label>
                                        <div>
                                            <img id="coverPreviewImg" src="" alt="Cover Preview" class="rounded border shadow-sm" style="max-height: 180px; width: 100%; object-fit: cover;">
                                        </div>
                                    </div>
                                </div>

                                <div class="row">
                                    <div class="col-md-6 mb-3">
                                        <label class="form-label fw-bold">Phân loại buổi (Type)</label>
                                        <select class="form-select" th:field="*{type}">
                                            <option value="body_part">Body Part (Theo nhóm cơ)</option>
                                            <option value="timed">Timed (Thời lượng)</option>
                                            <option value="goal">Goal (Theo mục tiêu)</option>
                                            <option value="tabata">Tabata (6 phút)</option>
                                            <option value="stretch">Stretch (Kéo giãn)</option>
                                            <option value="signature">Signature (Đặc biệt)</option>
                                        </select>
                                    </div>
                                    <div class="col-md-6 mb-3">
                                        <label class="form-label fw-bold">Nhóm cơ chính</label>
                                        <select class="form-select" th:field="*{primaryMuscle}">
                                            <option value="Bụng">Bụng</option>
                                            <option value="Tay">Tay</option>
                                            <option value="Ngực">Ngực</option>
                                            <option value="Lưng">Lưng</option>
                                            <option value="Chân">Chân</option>
                                            <option value="Toàn thân">Toàn thân</option>
                                        </select>
                                    </div>
                                </div>

                                <div class="row">
                                    <div class="col-md-4 mb-3">
                                        <label class="form-label fw-bold">Độ khó</label>
                                        <select class="form-select" th:field="*{level}">
                                            <option value="easy">Dễ (Easy)</option>
                                            <option value="medium">Trung bình (Medium)</option>
                                            <option value="hard">Khó (Hard)</option>
                                        </select>
                                    </div>
                                    <div class="col-md-4 mb-3">
                                        <label class="form-label fw-bold">Thẻ Mục tiêu (Goal tag)</label>
                                        <select class="form-select" th:field="*{goal}">
                                            <option value="abs">Cơ bụng (Abs)</option>
                                            <option value="chest">Ngực & Tay (Chest)</option>
                                            <option value="legs">Chân & Mông (Legs)</option>
                                            <option value="full_body">Toàn thân (Full Body)</option>
                                            <option value="fatloss">Đốt cháy mỡ (Fat Loss)</option>
                                            <option value="muscle">Xây dựng cơ bắp (Muscle)</option>
                                            <option value="keepfit">Giữ dáng (Keep Fit)</option>
                                            <option value="tabata">Tabata</option>
                                            <option value="stretch">Kéo giãn (Stretch)</option>
                                        </select>
                                    </div>
                                    <div class="col-md-4 mb-3">
                                        <label class="form-label fw-bold">Trạng thái</label>
                                        <select class="form-select" th:field="*{status}">
                                            <option value="PUBLISHED">Phát hành (PUBLISHED)</option>
                                            <option value="DRAFT">Bản nháp (DRAFT)</option>
                                        </select>
                                    </div>
                                </div>

                                <div class="row">
                                    <div class="col-md-6 mb-3">
                                        <label class="form-label fw-bold">Thời gian làm mỗi bài (giây)</label>
                                        <input type="number" class="form-control" th:field="*{workSec}" min="5" required>
                                    </div>
                                    <div class="col-md-6 mb-3">
                                        <label class="form-label fw-bold">Thời gian nghỉ (giây)</label>
                                        <input type="number" class="form-control" th:field="*{restSec}" min="0" required>
                                    </div>
                                </div>

                                <button type="submit" class="btn btn-primary btn-lg fw-bold"><i class="bi bi-save me-1"></i>Lưu buổi tập</button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
</div>

<div th:replace="~{admin/fragments :: scripts}"></div>
<script>
    function updateCoverPreview() {
        const url = document.getElementById('coverImageUrl').value.trim();
        const container = document.getElementById('coverPreviewContainer');
        const img = document.getElementById('coverPreviewImg');
        if (url) {
            img.src = url;
            container.style.display = 'block';
        } else {
            container.style.display = 'none';
        }
    }

    function uploadCoverFile(input) {
        if (!input.files || input.files.length === 0) return;
        const file = input.files[0];
        const statusDiv = document.getElementById('uploadStatus');
        statusDiv.className = "small text-info mt-1";
        statusDiv.innerText = "Đang tải ảnh lên server...";

        const formData = new FormData();
        formData.append("file", file);

        fetch('/admin/workouts/upload-cover', {
            method: 'POST',
            body: formData
        })
        .then(response => response.json())
        .then(data => {
            if (data.status === "OK" && data.url) {
                document.getElementById('coverImageUrl').value = data.url;
                statusDiv.className = "small text-success mt-1";
                statusDiv.innerText = "Đã tải ảnh lên thành công: " + data.url;
                updateCoverPreview();
            } else {
                statusDiv.className = "small text-danger mt-1";
                statusDiv.innerText = "Lỗi tải ảnh: " + (data.message || "Không xác định");
            }
        })
        .catch(err => {
            statusDiv.className = "small text-danger mt-1";
            statusDiv.innerText = "Lỗi kết nối: " + err.message;
        });
    }

    function previewCover() {
        const url = document.getElementById('coverImageUrl').value;
        if (url) {
            window.open(url, 'Preview', 'width=800,height=500,scrollbars=yes');
        } else {
            alert("Vui lòng nhập hoặc tải Ảnh bìa trước khi xem.");
        }
    }

    document.addEventListener("DOMContentLoaded", function() {
        updateCoverPreview();
    });
</script>
</body>
</html>
