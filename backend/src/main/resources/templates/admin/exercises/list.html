<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admin/fragments :: head('Danh sách Bài tập')}"></head>
<body>
<div th:replace="~{admin/fragments :: navbar}"></div>

<div class="container-fluid">
    <div class="row">
        <nav th:replace="~{admin/fragments :: sidebar}"></nav>

        <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 main-content">
            <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-4 border-bottom">
                <h1 class="h2 d-flex align-items-center">
                    <i class="bi bi-collection-play-fill text-primary me-2"></i>
                    Quản lý Bài tập
                    <span class="badge bg-primary ms-3 fs-6" th:text="${totalCount != null ? totalCount + ' bài tập' : ''}">116 bài tập</span>
                </h1>
                <div class="btn-toolbar mb-2 mb-md-0">
                    <button type="button" class="btn btn-sm btn-outline-secondary me-2" data-bs-toggle="modal" data-bs-target="#importModal">
                        <i class="bi bi-upload"></i> Nhập CSV
                    </button>
                    <a th:href="@{/admin/exercises/new}" class="btn btn-sm btn-primary">
                        <i class="bi bi-plus-lg"></i> Thêm bài tập mới
                    </a>
                </div>
            </div>

            <div th:if="${message}" class="alert alert-success alert-dismissible fade show" role="alert">
                <span th:text="${message}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>

            <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert">
                <span th:text="${errorMessage}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>

            <!-- Thanh Lọc & Sắp Xếp -->
            <div class="card mb-4 bg-light border-0">
                <div class="card-body py-2 px-3">
                    <form th:action="@{/admin/exercises}" method="get" class="row g-2 align-items-center">
                        <div class="col-auto">
                            <label for="categoryId" class="col-form-label fw-bold small"><i class="bi bi-funnel-fill me-1"></i>Nhóm cơ:</label>
                        </div>
                        <div class="col-auto me-3">
                            <select class="form-select form-select-sm" name="categoryId" id="categoryId" onchange="this.form.submit()">
                                <option value="">Tất cả các nhóm cơ</option>
                                <option th:each="cat : ${categoryOptions}" th:value="${cat.id}" th:text="${cat.name}" th:selected="${cat.id == selectedCategoryId}"></option>
                            </select>
                        </div>

                        <div class="col-auto">
                            <label for="sortBy" class="col-form-label fw-bold small"><i class="bi bi-sort-down me-1"></i>Sắp xếp theo:</label>
                        </div>
                        <div class="col-auto">
                            <select class="form-select form-select-sm" name="sortBy" id="sortBy" onchange="this.form.submit()">
                                <option value="sortOrder" th:selected="${sortBy == 'sortOrder'}">Thứ tự hiển thị</option>
                                <option value="name" th:selected="${sortBy == 'name'}">Tên bài tập (A - Z)</option>
                                <option value="id" th:selected="${sortBy == 'id'}">Mã ID bài tập</option>
                                <option value="category" th:selected="${sortBy == 'category'}">Nhóm cơ</option>
                                <option value="status" th:selected="${sortBy == 'status'}">Trạng thái (Bật / Ẩn)</option>
                            </select>
                        </div>

                        <div class="col-auto">
                            <select class="form-select form-select-sm" name="sortDir" id="sortDir" onchange="this.form.submit()">
                                <option value="asc" th:selected="${sortDir == 'asc'}">Tăng dần (ASC ▲)</option>
                                <option value="desc" th:selected="${sortDir == 'desc'}">Giảm dần (DESC ▼)</option>
                            </select>
                        </div>
                    </form>
                </div>
            </div>

            <div class="card">
                <div class="card-body p-0">
                    <div class="table-responsive">
                        <table class="table table-striped table-hover align-middle mb-0">
                            <thead class="table-light">
                            <tr>
                                <th class="ps-4">
                                    <a th:href="@{/admin/exercises(categoryId=${selectedCategoryId}, sortBy='id', sortDir=${sortBy == 'id' and sortDir == 'asc' ? 'desc' : 'asc'})}" class="text-dark text-decoration-none">
                                        ID <i class="bi bi-arrow-down-up small ms-1"></i>
                                    </a>
                                </th>
                                <th>
                                    <a th:href="@{/admin/exercises(categoryId=${selectedCategoryId}, sortBy='name', sortDir=${sortBy == 'name' and sortDir == 'asc' ? 'desc' : 'asc'})}" class="text-dark text-decoration-none">
                                        Tên bài tập <i class="bi bi-arrow-down-up small ms-1"></i>
                                    </a>
                                </th>
                                <th>
                                    <a th:href="@{/admin/exercises(categoryId=${selectedCategoryId}, sortBy='category', sortDir=${sortBy == 'category' and sortDir == 'asc' ? 'desc' : 'asc'})}" class="text-dark text-decoration-none">
                                        Nhóm cơ <i class="bi bi-arrow-down-up small ms-1"></i>
                                    </a>
                                </th>
                                <th>Loại Media</th>
                                <th>Chế độ / Thông số</th>
                                <th>Nghỉ</th>
                                <th>
                                    <a th:href="@{/admin/exercises(categoryId=${selectedCategoryId}, sortBy='status', sortDir=${sortBy == 'status' and sortDir == 'asc' ? 'desc' : 'asc'})}" class="text-dark text-decoration-none">
                                        Trạng thái <i class="bi bi-arrow-down-up small ms-1"></i>
                                    </a>
                                </th>
                                <th class="pe-4 text-end">Thao tác</th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr th:if="${exercises == null or exercises.isEmpty()}">
                                <td colspan="8" class="text-center py-4 text-muted">Chưa có dữ liệu bài tập</td>
                            </tr>
                            <tr th:each="ex : ${exercises}">
                                <td class="ps-4" th:text="${ex.id}">1</td>
                                <td class="fw-bold" th:text="${ex.name}">Plank</td>
                                <td>
                                    <span class="badge bg-info text-dark" th:text="${ex.categoryName}">Bụng</span>
                                </td>
                                <td>
                                    <span class="badge bg-dark" th:text="${ex.mediaType}">GIF</span>
                                </td>
                                <td th:text="${ex.modeText}">30 giây</td>
                                <td th:text="${ex.restSec + 's'}">15s</td>
                                <td>
                                    <span class="badge" th:classappend="${ex.active} ? 'bg-success' : 'bg-secondary'"
                                          th:text="${ex.active} ? 'Hoạt động' : 'Đã ẩn'">Hoạt động</span>
                                </td>
                                <td class="pe-4 text-end">
                                    <a th:href="@{/admin/exercises/{id}/edit(id=${ex.id})}" class="btn btn-sm btn-outline-primary">
                                        <i class="bi bi-pencil"></i> Sửa
                                    </a>
                                    <form th:action="@{/admin/exercises/{id}/toggle(id=${ex.id})}" method="post" class="d-inline">
                                        <button type="submit" class="btn btn-sm" th:classappend="${ex.active ? 'btn-outline-warning' : 'btn-outline-success'}">
                                            <i class="bi" th:classappend="${ex.active ? 'bi-eye-slash' : 'bi-eye'}"></i>
                                        </button>
                                    </form>
                                </td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>
</div>

<!-- Modal Import CSV -->
<div class="modal fade" id="importModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
        <form th:action="@{/admin/exercises/import}" method="post" enctype="multipart/form-data">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Nhập Bài tập từ CSV</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <label for="csvFile" class="form-label">Chọn file CSV (Cấu trúc: categoryId, name, description, durationSec, reps, restSec, mediaType, mediaUrl, sortOrder)</label>
                        <input class="form-control" type="file" id="csvFile" name="file" accept=".csv" required>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Hủy</button>
                    <button type="submit" class="btn btn-primary">Nhập dữ liệu</button>
                </div>
            </div>
        </form>
    </div>
</div>

<div th:replace="~{admin/fragments :: scripts}"></div>
</body>
</html>
