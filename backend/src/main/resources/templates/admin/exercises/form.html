<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admin/fragments :: head(${exercise.id == null ? 'Thêm Bài tập' : 'Sửa Bài tập'})}"></head>
<body>
<div th:replace="~{admin/fragments :: navbar}"></div>

<div class="container-fluid">
    <div class="row">
        <nav th:replace="~{admin/fragments :: sidebar}"></nav>

        <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 main-content">
            <div class="pt-3 pb-2 mb-4 border-bottom">
                <h1 class="h2" th:text="${exercise.id == null ? 'Thêm mới Bài tập' : 'Cập nhật Bài tập'}"></h1>
            </div>

            <div class="card" style="max-width: 800px;">
                <div class="card-body">
                    <form th:action="@{${exercise.id == null ? '/admin/exercises/create' : '/admin/exercises/' + exercise.id + '/edit'}}"
                          th:object="${exercise}" method="post" id="exerciseForm">

                        <div th:if="${#fields.hasAnyErrors()}" class="alert alert-danger">
                            Vui lòng kiểm tra lại thông tin. Đảm bảo nhập đúng Thời gian HOẶC Số lần.
                        </div>

                        <div class="row mb-3">
                            <div class="col-md-8">
                                <label for="name" class="form-label fw-bold">Tên bài tập <span class="text-danger">*</span></label>
                                <input type="text" class="form-control" id="name" th:field="*{name}" required>
                                <div class="text-danger small mt-1" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
                            </div>
                            <div class="col-md-4">
                                <label for="category" class="form-label fw-bold">Nhóm cơ <span class="text-danger">*</span></label>
                                <select class="form-select" id="category" th:field="*{categoryId}" required>
                                    <option value="">-- Chọn nhóm cơ --</option>
                                    <option th:each="cat : ${categories}" th:value="${cat.id}" th:text="${cat.name}"></option>
                                </select>
                                <div class="text-danger small mt-1" th:if="${#fields.hasErrors('categoryId')}" th:errors="*{categoryId}"></div>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="description" class="form-label fw-bold">Mô tả hướng dẫn</label>
                            <textarea class="form-control" id="description" th:field="*{description}" rows="3"></textarea>
                        </div>

                        <div class="row mb-3">
                            <div class="col-md-9">
                                <label for="mediaUrl" class="form-label fw-bold">Media URL (Video/GIF) <span class="text-danger">*</span></label>
                                <div class="input-group">
                                    <input type="url" class="form-control" id="mediaUrl" th:field="*{mediaUrl}" required>
                                    <button class="btn btn-outline-secondary" type="button" onclick="previewMedia()">Xem trước</button>
                                </div>
                                <div class="text-danger small mt-1" th:if="${#fields.hasErrors('mediaUrl')}" th:errors="*{mediaUrl}"></div>
                            </div>
                            <div class="col-md-3">
                                <label for="mediaType" class="form-label fw-bold">Loại Media <span class="text-danger">*</span></label>
                                <select class="form-select" id="mediaType" th:field="*{mediaType}" required>
                                    <option value="GIF">GIF</option>
                                    <option value="VIDEO">VIDEO</option>
                                </select>
                            </div>
                        </div>

                        <div class="card bg-light border-0 mb-3">
                            <div class="card-body">
                                <p class="fw-bold mb-2">Thông số tập luyện (Nhập Thời gian HOẶC Số lần) <span class="text-danger">*</span></p>
                                <div class="row g-3">
                                    <div class="col-md-4">
                                        <label for="durationSec" class="form-label small">Thời gian (giây)</label>
                                        <input type="number" class="form-control" id="durationSec" th:field="*{durationSec}" min="1" placeholder="Ví dụ: 30">
                                        <div class="text-danger small mt-1" th:if="${#fields.hasErrors('durationSec')}" th:errors="*{durationSec}"></div>
                                    </div>
                                    <div class="col-md-4">
                                        <label for="reps" class="form-label small">Số lần (reps)</label>
                                        <input type="number" class="form-control" id="reps" th:field="*{reps}" min="1" placeholder="Ví dụ: 12">
                                        <div class="text-danger small mt-1" th:if="${#fields.hasErrors('reps')}" th:errors="*{reps}"></div>
                                    </div>
                                    <div class="col-md-4">
                                        <label for="restSec" class="form-label fw-bold">Thời gian nghỉ (giây) <span class="text-danger">*</span></label>
                                        <input type="number" class="form-control border-primary" id="restSec" th:field="*{restSec}" min="0" required>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div class="row mb-4">
                            <div class="col-md-4">
                                <label for="sortOrder" class="form-label fw-bold">Thứ tự hiển thị <span class="text-danger">*</span></label>
                                <input type="number" class="form-control" id="sortOrder" th:field="*{sortOrder}" min="0" required>
                            </div>
                            <div class="col-md-8 d-flex align-items-end pb-2">
                                <div class="form-check form-switch ms-3">
                                    <input class="form-check-input" type="checkbox" id="isActive" th:field="*{isActive}">
                                    <label class="form-check-label fw-bold" for="isActive">Hoạt động (Hiển thị trên App)</label>
                                </div>
                            </div>
                        </div>

                        <div class="d-flex justify-content-end gap-2">
                            <a th:href="@{/admin/exercises}" class="btn btn-light border">Hủy</a>
                            <button type="submit" class="btn btn-primary"><i class="bi bi-save"></i> Lưu lại</button>
                        </div>
                    </form>
                </div>
            </div>
        </main>
    </div>
</div>

<div th:replace="~{admin/fragments :: scripts}"></div>
<script>
    function previewMedia() {
        const url = document.getElementById('mediaUrl').value;
        if (url) {
            window.open(url, 'Preview', 'width=600,height=600,scrollbars=yes');
        } else {
            alert("Vui lòng nhập Media URL trước khi xem.");
        }
    }

    // Tự động vô hiệu hóa trường còn lại để đảm bảo chỉ nhập Duration HOẶC Reps
    document.addEventListener('DOMContentLoaded', function() {
        const durationInput = document.getElementById('durationSec');
        const repsInput = document.getElementById('reps');

        function toggleInputs() {
            if (durationInput.value) {
                repsInput.disabled = true;
            } else if (repsInput.value) {
                durationInput.disabled = true;
            } else {
                repsInput.disabled = false;
                durationInput.disabled = false;
            }
        }

        durationInput.addEventListener('input', toggleInputs);
        repsInput.addEventListener('input', toggleInputs);
        toggleInputs();
    });
</script>
</body>
</html>
