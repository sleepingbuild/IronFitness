<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admin/fragments :: head(${title})}"></head>
<body>
<div th:replace="~{admin/fragments :: navbar}"></div>

<div class="container-fluid">
    <div class="row">
        <nav th:replace="~{admin/fragments :: sidebar}"></nav>

        <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 main-content">
            <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-4 border-bottom">
                <h1 class="h2"><i class="bi bi-pencil-square text-primary me-2"></i><span th:text="${title}">Soạn thảo Bài tập</span></h1>
                <a th:href="@{/admin/exercises}" class="btn btn-outline-secondary"><i class="bi bi-arrow-left me-1"></i>Quay lại</a>
            </div>

            <div class="card style-card" style="max-width: 800px;">
                <div class="card-body">
                    <form th:action="@{${formAction}}" th:object="${form}" method="post" id="exerciseForm">

                        <div th:if="${#fields.hasAnyErrors()}" class="alert alert-danger alert-dismissible fade show">
                            <i class="bi bi-exclamation-triangle-fill me-2"></i>Vui lòng kiểm tra lại các trường dữ liệu bị lỗi bên dưới.
                            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                        </div>

                        <div class="row mb-3">
                            <div class="col-md-8">
                                <label for="name" class="form-label fw-bold">Tên bài tập <span class="text-danger">*</span></label>
                                <input type="text" class="form-control" id="name" th:field="*{name}" placeholder="Ví dụ: Plank khuỷu tay" required>
                                <div class="text-danger small mt-1" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
                            </div>
                            <div class="col-md-4">
                                <label for="categoryId" class="form-label fw-bold">Nhóm cơ <span class="text-danger">*</span></label>
                                <select class="form-select" id="categoryId" th:field="*{categoryId}" required>
                                    <option value="">-- Chọn nhóm cơ --</option>
                                    <option th:each="cat : ${categoryOptions}" th:value="${cat.id}" th:text="${cat.name}"></option>
                                </select>
                                <div class="text-danger small mt-1" th:if="${#fields.hasErrors('categoryId')}" th:errors="*{categoryId}"></div>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="description" class="form-label fw-bold">Mô tả / Hướng dẫn thực hiện</label>
                            <textarea class="form-control" id="description" th:field="*{description}" rows="3" placeholder="Mô tả các bước thực hiện động tác..."></textarea>
                            <div class="text-danger small mt-1" th:if="${#fields.hasErrors('description')}" th:errors="*{description}"></div>
                        </div>

                        <div class="row mb-3">
                            <div class="col-md-9">
                                <label for="mediaUrl" class="form-label fw-bold">Media URL (Video / GIF / Ảnh) <span class="text-danger">*</span></label>
                                <div class="input-group">
                                    <input type="text" class="form-control" id="mediaUrl" th:field="*{mediaUrl}" placeholder="https://... hoặc /uploads/..." required>
                                    <input type="file" id="mediaFileInput" accept="image/*,.gif" style="display:none;" onchange="uploadMediaFile(this)">
                                    <button class="btn btn-outline-primary" type="button" onclick="document.getElementById('mediaFileInput').click()"><i class="bi bi-upload me-1"></i>Tải ảnh/GIF lên</button>
                                    <button class="btn btn-outline-secondary" type="button" onclick="previewMedia()"><i class="bi bi-eye me-1"></i>Xem trước</button>
                                </div>
                                <div class="text-danger small mt-1" th:if="${#fields.hasErrors('mediaUrl')}" th:errors="*{mediaUrl}"></div>
                                <div id="uploadStatus" class="small mt-1"></div>
                            </div>
                            <div class="col-md-3">
                                <label for="mediaType" class="form-label fw-bold">Loại Media <span class="text-danger">*</span></label>
                                <select class="form-select" id="mediaType" th:field="*{mediaType}" required>
                                    <option value="GIF">GIF / Ảnh</option>
                                    <option value="VIDEO">VIDEO</option>
                                </select>
                            </div>
                        </div>

                        <div class="card bg-light border-0 mb-3">
                            <div class="card-body">
                                <p class="fw-bold mb-2">Thông số tập luyện (Chế độ tập & Giá trị) <span class="text-danger">*</span></p>
                                <div class="row g-3">
                                    <div class="col-md-4">
                                        <label for="mode" class="form-label small fw-bold">Cách tính</label>
                                        <select class="form-select" id="mode" th:field="*{mode}" required>
                                            <option value="DURATION">Theo thời gian (Giây)</option>
                                            <option value="REPS">Theo số lần (Reps)</option>
                                        </select>
                                    </div>
                                    <div class="col-md-4">
                                        <label for="amount" class="form-label small fw-bold">Giá trị (Số giây / Số lần)</label>
                                        <input type="number" class="form-control" id="amount" th:field="*{amount}" min="1" max="3600" required placeholder="Ví dụ: 30 hoặc 12">
                                        <div class="text-danger small mt-1" th:if="${#fields.hasErrors('amount')}" th:errors="*{amount}"></div>
                                    </div>
                                    <div class="col-md-4">
                                        <label for="restSec" class="form-label small fw-bold">Thời gian nghỉ (giây)</label>
                                        <input type="number" class="form-control border-primary" id="restSec" th:field="*{restSec}" min="0" max="600" required>
                                        <div class="text-danger small mt-1" th:if="${#fields.hasErrors('restSec')}" th:errors="*{restSec}"></div>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div class="row mb-4">
                            <div class="col-md-4">
                                <label for="sortOrder" class="form-label fw-bold">Thứ tự hiển thị <span class="text-danger">*</span></label>
                                <input type="number" class="form-control" id="sortOrder" th:field="*{sortOrder}" min="0" required>
                            </div>
                            <div class="col-md-8 d-flex align-items-end pb-2">
                                <div class="form-check form-switch ms-3">
                                    <input class="form-check-input" type="checkbox" id="active" th:field="*{active}">
                                    <label class="form-check-label fw-bold" for="active">Kích hoạt (Hiển thị trên Mobile App)</label>
                                </div>
                            </div>
                        </div>

                        <div class="d-flex justify-content-end gap-2">
                            <a th:href="@{/admin/exercises}" class="btn btn-light border">Hủy</a>
                            <button type="submit" class="btn btn-primary"><i class="bi bi-save me-1"></i>Lưu thông tin</button>
                        </div>
                    </form>
                </div>
            </div>
        </main>
    </div>
</div>

<div th:replace="~{admin/fragments :: scripts}"></div>
<script>
    function uploadMediaFile(input) {
        if (!input.files || input.files.length === 0) return;
        const file = input.files[0];
        const statusDiv = document.getElementById('uploadStatus');
        statusDiv.className = "small text-info mt-1";
        statusDiv.innerText = "Đang tải tệp lên server...";

        const formData = new FormData();
        formData.append("file", file);

        fetch('/admin/exercises/upload-media', {
            method: 'POST',
            body: formData
        })
        .then(response => response.json())
        .then(data => {
            if (data.status === "OK" && data.url) {
                document.getElementById('mediaUrl').value = data.url;
                statusDiv.className = "small text-success mt-1";
                statusDiv.innerText = "Đã tải lên thành công: " + data.url;
                if (file.name.toLowerCase().endsWith(".gif") || file.name.toLowerCase().endsWith(".png") || file.name.toLowerCase().endsWith(".jpg")) {
                    document.getElementById('mediaType').value = "GIF";
                }
            } else {
                statusDiv.className = "small text-danger mt-1";
                statusDiv.innerText = "Lỗi tải tệp: " + (data.message || "Không xác định");
            }
        })
        .catch(err => {
            statusDiv.className = "small text-danger mt-1";
            statusDiv.innerText = "Lỗi kết nối: " + err.message;
        });
    }

    function previewMedia() {
        const url = document.getElementById('mediaUrl').value;
        if (url) {
            window.open(url, 'Preview', 'width=600,height=600,scrollbars=yes');
        } else {
            alert("Vui lòng nhập hoặc tải Media URL trước khi xem.");
        }
    }
</script>
</body>
</html>
