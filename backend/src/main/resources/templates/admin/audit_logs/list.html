<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admin/fragments :: head('Nhật ký Hoạt động')}"></head>
<body>
<div th:replace="~{admin/fragments :: navbar}"></div>

<div class="container-fluid">
    <div class="row">
        <nav th:replace="~{admin/fragments :: sidebar}"></nav>

        <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 main-content">
            <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-4 border-bottom">
                <h1 class="h2"><i class="bi bi-shield-check text-primary me-2"></i>Nhật ký Hoạt động (Audit Log)</h1>
            </div>

            <div class="card">
                <div class="card-body p-0">
                    <div class="table-responsive">
                        <table class="table table-hover align-middle mb-0">
                            <thead class="table-light">
                                <tr>
                                    <th>Thời gian</th>
                                    <th>Quản trị viên</th>
                                    <th>Hành động</th>
                                    <th>Đối tượng</th>
                                    <th>Mã đối tượng</th>
                                    <th>Chi tiết</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="log : ${logs}">
                                    <td th:text="${#temporals.format(log.createdAt, 'dd/MM/yyyy HH:mm:ss')}">10/11/2026 17:35:00</td>
                                    <td class="fw-bold" th:text="${log.adminEmail}">admin@homefit.com</td>
                                    <td><span class="badge bg-info text-dark" th:text="${log.action}">UPDATE</span></td>
                                    <td th:text="${log.entityName}">Exercise</td>
                                    <td th:text="${log.entityId}">12</td>
                                    <td th:text="${log.detail}">Cập nhật thông tin bài tập</td>
                                </tr>
                                <tr th:if="${#lists.isEmpty(logs)}">
                                    <td colspan="6" class="text-center py-4 text-muted">Chưa có nhật ký hoạt động nào được ghi nhận.</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>
</div>

<div th:replace="~{admin/fragments :: scripts}"></div>
</body>
</html>
