<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admin/fragments :: head('Quản lý Trang chủ')}"></head>
<body>
<div th:replace="~{admin/fragments :: navbar}"></div>

<div class="container-fluid">
    <div class="row">
        <nav th:replace="~{admin/fragments :: sidebar}"></nav>

        <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 main-content">
            <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-4 border-bottom">
                <h1 class="h2"><i class="bi bi-layout-sidebar-reverse text-primary me-2"></i>Cấu hình Trang chủ Mobile App</h1>
            </div>

            <div th:if="${message}" class="alert alert-success alert-dismissible fade show" role="alert">
                <span th:text="${message}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>

            <div class="card">
                <div class="card-body p-0">
                    <div class="table-responsive">
                        <table class="table table-hover align-middle mb-0">
                            <thead class="table-light">
                                <tr>
                                    <th>Mục hiển thị (Section)</th>
                                    <th>Mã Key</th>
                                    <th>Loại Section</th>
                                    <th>Thứ tự</th>
                                    <th>Trạng thái</th>
                                    <th class="text-end">Thao tác</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="s : ${sections}">
                                    <td class="fw-bold" th:text="${s.titleVi}">Hero Challenge</td>
                                    <td th:text="${s.sectionKey}">hero_challenge</td>
                                    <td><span class="badge bg-secondary" th:text="${s.sectionType}">hero</span></td>
                                    <td th:text="${s.sortOrder}">1</td>
                                    <td>
                                        <span class="badge" th:classappend="${s.enabled ? 'bg-success' : 'bg-secondary'}" th:text="${s.enabled ? 'HIỂN THỊ' : 'ẨN'}">HIỂN THỊ</span>
                                    </td>
                                    <td class="text-end">
                                        <form th:action="@{/admin/home-sections/{id}/toggle(id=${s.id})}" method="post" class="d-inline">
                                            <button type="submit" class="btn btn-sm" th:classappend="${s.enabled ? 'btn-outline-warning' : 'btn-outline-success'}">
                                                <i class="bi" th:classappend="${s.enabled ? 'bi-eye-slash' : 'bi-eye'}"></i>
                                                <span th:text="${s.enabled ? 'Ẩn' : 'Bật'}">Bật</span>
                                            </button>
                                        </form>
                                    </td>
                                </tr>
                                <tr th:if="${#lists.isEmpty(sections)}">
                                    <td colspan="6" class="text-center py-4 text-muted">Chưa có mục trang chủ nào. Các mục mặc định của App sẽ tự động hiển thị.</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>
</div>

<div th:replace="~{admin/fragments :: scripts}"></div>
</body>
</html>
