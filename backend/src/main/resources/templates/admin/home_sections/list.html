<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admin/fragments :: head('Quản lý Trang chủ')}"></head>
<body>
<div th:replace="~{admin/fragments :: navbar}"></div>

<div class="container-fluid">
    <div class="row">
        <nav th:replace="~{admin/fragments :: sidebar}"></nav>

        <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 main-content">
            <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-4 border-bottom">
                <h1 class="h2"><i class="bi bi-layout-sidebar-reverse text-primary me-2"></i>Cấu hình Trang chủ Mobile App</h1>
            </div>

            <div th:if="${message}" class="alert alert-success alert-dismissible fade show" role="alert">
                <span th:text="${message}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>

            <div class="card">
                <div class="card-body p-0">
                    <div class="table-responsive">
                        <table class="table table-hover align-middle mb-0">
                            <thead class="table-light">
                                <tr>
                                    <th>Mục hiển thị (Section)</th>
                                    <th>Mã Key</th>
                                    <th>Loại Section</th>
                                    <th>Thứ tự</th>
                                    <th>Trạng thái</th>
                                    <th class="text-end">Thao tác</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="s : ${sections}">
                                    <td class="fw-bold" th:text="${s.titleVi}">Hero Challenge</td>
                                    <td th:text="${s.sectionKey}">hero_challenge</td>
                                    <td><span class="badge bg-secondary" th:text="${s.sectionType}">hero</span></td>
                                    <td th:text="${s.sortOrder}">1</td>
                                    <td>
                                        <span class="badge" th:classappend="${s.enabled ? 'bg-success' : 'bg-secondary'}" th:text="${s.enabled ? 'HIỂN THỊ' : 'ẨN'}">HIỂN THỊ</span>
                                    </td>
                                    <td class="text-end">
                                        <button type="button" class="btn btn-sm btn-outline-primary me-1" data-bs-toggle="modal" th:data-bs-target="${'#editModal' + s.id}">
                                            <i class="bi bi-pencil"></i> Sửa
                                        </button>
                                        <form th:action="@{/admin/home-sections/{id}/toggle(id=${s.id})}" method="post" class="d-inline">
                                            <button type="submit" class="btn btn-sm" th:classappend="${s.enabled ? 'btn-outline-warning' : 'btn-outline-success'}">
                                                <i class="bi" th:classappend="${s.enabled ? 'bi-eye-slash' : 'bi-eye'}"></i>
                                                <span th:text="${s.enabled ? 'Ẩn' : 'Bật'}">Bật</span>
                                            </button>
                                        </form>

                                        <!-- Modal Sửa Section -->
                                        <div class="modal fade text-start" th:id="${'editModal' + s.id}" tabindex="-1" aria-hidden="true">
                                            <div class="modal-dialog">
                                                <form th:action="@{/admin/home-sections/{id}(id=${s.id})}" method="post">
                                                    <div class="modal-content">
                                                        <div class="modal-header">
                                                            <h5 class="modal-title fw-bold">Chỉnh sửa Mục Trang chủ</h5>
                                                            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                                                        </div>
                                                        <div class="modal-body">
                                                            <div class="mb-3">
                                                                <label class="form-label fw-bold">Mã Key</label>
                                                                <input type="text" class="form-control bg-light" th:value="${s.sectionKey}" readonly>
                                                            </div>
                                                            <div class="mb-3">
                                                                <label class="form-label fw-bold">Tên hiển thị (Tiếng Việt)</label>
                                                                <input type="text" class="form-control" name="titleVi" th:value="${s.titleVi}" required>
                                                            </div>
                                                            <div class="mb-3">
                                                                <label class="form-label fw-bold">Thứ tự sắp xếp (Sort Order)</label>
                                                                <input type="number" class="form-control" name="sortOrder" th:value="${s.sortOrder}" min="0" required>
                                                            </div>
                                                        </div>
                                                        <div class="modal-footer">
                                                            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Hủy</button>
                                                            <button type="submit" class="btn btn-primary fw-bold">Lưu thay đổi</button>
                                                        </div>
                                                    </div>
                                                </form>
                                            </div>
                                        </div>

                                    </td>
                                </tr>
                                <tr th:if="${#lists.isEmpty(sections)}">
                                    <td colspan="6" class="text-center py-4 text-muted">Chưa có mục trang chủ nào. Các mục mặc định của App sẽ tự động hiển thị.</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>
</div>

<div th:replace="~{admin/fragments :: scripts}"></div>
</body>
</html>
