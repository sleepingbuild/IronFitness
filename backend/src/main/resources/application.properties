spring.application.name=homefit-server
server.port=8080

# Kết nối MySQL và bí mật nằm trong application-local.yml (KHÔNG commit).
# Mẫu: application-example.yml. Chạy: mvnw spring-boot:run -Dspring-boot.run.profiles=local

# Schema chỉ đổi qua Flyway (src/main/resources/db/migration). KHÔNG dùng ddl-auto=update.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
# Thời gian lưu UTC (DATETIME)
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
