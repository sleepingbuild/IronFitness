spring.application.name=homefit-server
server.port=8090

# Schema chỉ đổi qua Flyway (src/main/resources/db/migration). KHÔNG dùng ddl-auto=update.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
# Thời gian lưu UTC (DATETIME)
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.repair-on-migrate=true
spring.flyway.baseline-on-migrate=true

spring.datasource.url=jdbc:mysql://localhost:3306/homefit?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=#Clgt6900

# Cấu hình JWT mặc định (Tối thiểu 32 ký tự)
homefit.jwt.secret=HomeFitDefaultSecretKeyForJwtTokenMustBeAtLeast32BytesLong!
homefit.jwt.access-token-minutes=60
homefit.jwt.refresh-token-days=30

# Cấu hình Admin mặc định
homefit.admin.email=admin@homefit.com
homefit.admin.password=admin123
